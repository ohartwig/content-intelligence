<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:ci="http://typo3.org/ns/Koh/ContentIntelligence/Presentation/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Content">
    <h1><f:translate key="pageDetail.title" arguments="{0: pageUid}" extensionName="ContentIntelligence" /></h1>

    <f:link.action action="index" class="btn btn-default mb-3"><f:translate key="button.backToOverview" extensionName="ContentIntelligence" /></f:link.action>

    <f:if condition="{results}">
        <f:then>
            <f:for each="{results}" as="result">
                <div class="card mb-3">
                    <div class="card-header">
                        <h3 class="card-title">{result.analyzerIdentifier} <ci:readinessScoreBadge score="{result.score}" /></h3>
                    </div>
                    <div class="card-body">
                        <f:if condition="{result.suggestions}">
                            <h4><f:translate key="pageDetail.suggestions" extensionName="ContentIntelligence" /></h4>
                            <ul><f:for each="{result.suggestions}" as="suggestion"><li>{suggestion}</li></f:for></ul>
                        </f:if>
                    </div>
                </div>
            </f:for>
        </f:then>
        <f:else><div class="callout callout-info"><f:translate key="pageDetail.noResults" extensionName="ContentIntelligence" /></div></f:else>
    </f:if>
</f:section>
</html>
