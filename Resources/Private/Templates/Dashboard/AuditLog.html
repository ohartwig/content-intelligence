<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Content">
    <h1><f:translate key="auditLog.title" extensionName="ContentIntelligence" /></h1>

    <f:link.action action="index" class="btn btn-default mb-3"><f:translate key="button.backToOverview" extensionName="ContentIntelligence" /></f:link.action>

    <f:if condition="{entries}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="auditLog.pageUid" extensionName="ContentIntelligence" /></th>
                        <th><f:translate key="auditLog.table" extensionName="ContentIntelligence" /></th>
                        <th><f:translate key="auditLog.field" extensionName="ContentIntelligence" /></th>
                        <th><f:translate key="auditLog.origin" extensionName="ContentIntelligence" /></th>
                        <th><f:translate key="auditLog.aiProvider" extensionName="ContentIntelligence" /></th>
                        <th><f:translate key="auditLog.created" extensionName="ContentIntelligence" /></th>
                        <th><f:translate key="auditLog.reviewed" extensionName="ContentIntelligence" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{entries}" as="entry">
                        <tr>
                            <td>{entry.pageUid}</td>
                            <td>{entry.tableName}</td>
                            <td>{entry.fieldName}</td>
                            <td><span class="badge">{entry.origin.value}</span></td>
                            <td>{entry.aiProvider}</td>
                            <td><f:format.date format="d.m.Y H:i">{entry.createdAt}</f:format.date></td>
                            <td><f:if condition="{entry.reviewedAt}"><f:then><span class="badge bg-success"><f:translate key="badge.reviewed" extensionName="ContentIntelligence" /></span></f:then><f:else><span class="badge bg-warning text-dark"><f:translate key="badge.pending" extensionName="ContentIntelligence" /></span></f:else></f:if></td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else><div class="callout callout-info"><f:translate key="auditLog.noEntries" extensionName="ContentIntelligence" /></div></f:else>
    </f:if>
</f:section>
</html>
